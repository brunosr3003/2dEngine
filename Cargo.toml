[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brunosr3003/2dEngine"

[workspace.dependencies]
# Logging & errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Math & bytemuck for GPU upload
glam = { version = "0.29", features = ["serde", "bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }

# ECS
hecs = "0.10"

# Async runtime & networking
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Rendering / windowing (cliente)
wgpu = "22.1"
winit = "0.30"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

# Audio (native only; wasm usa web-sys::AudioContext na fase 5)
rodio = { version = "0.17", default-features = false, features = ["mp3", "wav"] }

# Persistencia (servidor)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros"] }

# Web (auth / cadastro)
axum = "0.7"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
argon2 = "0.5"

# Internal workspace crates
engine = { path = "crates/engine" }
shared = { path = "crates/shared" }

[profile.dev]
opt-level = 1           # dev compila mais rapido mas roda decente
debug = 1

[profile.dev.package."*"]
opt-level = 3           # dependencias de terceiros sempre otimizadas

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
