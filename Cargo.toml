[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brunosr3003/2dEngine"

[workspace.dependencies]
# Logging & errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wire binario: varint, sem nome de campo. Ver protocol::encode.
postcard = { version = "1", features = ["alloc"] }

# Math
glam = { version = "0.29", features = ["serde"] }

# ECS
hecs = "0.10"

# Async runtime & networking
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Persistencia (servidor)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }

# Web (auth / cadastro)
axum = "0.7"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
argon2 = "0.5"

# Internal workspace crates
shared = { path = "crates/shared" }
correio = { path = "crates/correio" }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# miniquad 0.4.11 com o toque do iOS corrigido (vendor/miniquad, busque
# "TEMPEST" em src/native/ios.rs): o original mandava a fase de um dedo pra
# todos os do evento e deixava dedo fantasma — arrasto virava pinca e a camera
# so' dava zoom. Tirar quando a miniquad publicar a correcao.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
