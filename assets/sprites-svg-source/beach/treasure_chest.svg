<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Baú de tesouro pirata fechado, vista 3/4 -->
  <!-- Sombra -->
  <ellipse cx="32" cy="58" rx="20" ry="3" fill="#000000" fill-opacity="0.35"/>

  <!-- CORPO DO BAÚ (madeira marrom) -->
  <rect x="10" y="32" width="44" height="22" fill="#6a3a20"/>
  <rect x="10" y="54" width="44" height="2"  fill="#2a1810"/>
  <!-- Outline -->
  <rect x="10" y="32" width="44" height="1"  fill="#2a1810"/>
  <rect x="10" y="32" width="1"  height="22" fill="#2a1810"/>
  <rect x="53" y="32" width="1"  height="22" fill="#2a1810"/>
  <!-- Pranchas horizontais -->
  <rect x="11" y="38" width="42" height="1" fill="#4a2a18"/>
  <rect x="11" y="46" width="42" height="1" fill="#4a2a18"/>
  <rect x="11" y="34" width="42" height="1" fill="#8a5a30"/>
  <rect x="11" y="40" width="42" height="1" fill="#8a5a30"/>
  <rect x="11" y="48" width="42" height="1" fill="#8a5a30"/>
  <!-- Highlights nas pranchas -->
  <rect x="12" y="35" width="10" height="2" fill="#a06840"/>
  <rect x="28" y="35" width="12" height="2" fill="#a06840"/>
  <rect x="14" y="42" width="12" height="2" fill="#a06840"/>
  <rect x="32" y="42" width="14" height="2" fill="#a06840"/>

  <!-- TAMPA (curvada com degraus) -->
  <rect x="10" y="22" width="44" height="10" fill="#6a3a20"/>
  <rect x="12" y="20" width="40" height="2"  fill="#6a3a20"/>
  <rect x="14" y="18" width="36" height="2"  fill="#6a3a20"/>
  <rect x="18" y="16" width="28" height="2"  fill="#6a3a20"/>
  <!-- Outline da tampa -->
  <rect x="10" y="22" width="1"  height="10" fill="#2a1810"/>
  <rect x="53" y="22" width="1"  height="10" fill="#2a1810"/>
  <rect x="12" y="20" width="1"  height="2"  fill="#2a1810"/>
  <rect x="51" y="20" width="1"  height="2"  fill="#2a1810"/>
  <rect x="14" y="18" width="1"  height="2"  fill="#2a1810"/>
  <rect x="49" y="18" width="1"  height="2"  fill="#2a1810"/>
  <rect x="18" y="16" width="28" height="1"  fill="#2a1810"/>
  <rect x="18" y="16" width="1"  height="2"  fill="#2a1810"/>
  <rect x="45" y="16" width="1"  height="2"  fill="#2a1810"/>
  <!-- Highlight na tampa -->
  <rect x="16" y="20" width="6"  height="2" fill="#a06840"/>
  <rect x="22" y="18" width="20" height="2" fill="#a06840"/>
  <rect x="26" y="17" width="10" height="1" fill="#c08050"/>

  <!-- ARCOS DE METAL -->
  <rect x="12" y="16" width="40" height="2" fill="#3a3a3a"/>
  <rect x="12" y="16" width="40" height="1" fill="#6a6a6a"/>
  <!-- Arco baixo -->
  <rect x="10" y="42" width="44" height="2" fill="#3a3a3a"/>
  <rect x="10" y="42" width="44" height="1" fill="#6a6a6a"/>
  <!-- Arco médio (vertical central) -->
  <rect x="30" y="22" width="4"  height="32" fill="#3a3a3a"/>
  <rect x="30" y="22" width="2"  height="32" fill="#5a5a5a"/>
  <rect x="31" y="22" width="1"  height="32" fill="#6a6a6a"/>

  <!-- FECHADURA DOURADA -->
  <rect x="28" y="30" width="8"  height="8"  fill="#d4a53c"/>
  <rect x="28" y="30" width="8"  height="2"  fill="#f5c050"/>
  <rect x="28" y="36" width="8"  height="2"  fill="#8a5a20"/>
  <rect x="28" y="30" width="2"  height="8"  fill="#f5c050"/>
  <rect x="34" y="30" width="2"  height="8"  fill="#8a5a20"/>
  <!-- Buraco da chave -->
  <rect x="31" y="32" width="2"  height="3"  fill="#2a1410"/>
  <rect x="31" y="32" width="2"  height="1"  fill="#0a0a0a"/>

  <!-- PEGADORES LATERAIS (metal) -->
  <rect x="6"  y="30" width="4"  height="4" fill="#5a5a5a"/>
  <rect x="6"  y="30" width="4"  height="1" fill="#8a8a8a"/>
  <rect x="54" y="30" width="4"  height="4" fill="#5a5a5a"/>
  <rect x="54" y="30" width="4"  height="1" fill="#8a8a8a"/>

  <!-- PREGOS DOURADOS nos cantos -->
  <rect x="12" y="34" width="2" height="2" fill="#d4a53c"/>
  <rect x="50" y="34" width="2" height="2" fill="#d4a53c"/>
  <rect x="12" y="50" width="2" height="2" fill="#d4a53c"/>
  <rect x="50" y="50" width="2" height="2" fill="#d4a53c"/>
</svg>
