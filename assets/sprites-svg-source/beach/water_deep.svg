<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Água funda (mais azul escuro, ondas densas) -->
  <rect x="0" y="0" width="64" height="64" fill="#2a5aa0"/>

  <!-- Variação tonal -->
  <rect x="0"  y="8"  width="64" height="3" fill="#1a4080"/>
  <rect x="0"  y="22" width="64" height="3" fill="#1a4080"/>
  <rect x="0"  y="36" width="64" height="3" fill="#1a4080"/>
  <rect x="0"  y="50" width="64" height="3" fill="#1a4080"/>

  <!-- Faixas mais claras -->
  <rect x="0"  y="4"  width="64" height="2" fill="#3a7ad0"/>
  <rect x="0"  y="18" width="64" height="2" fill="#3a7ad0"/>
  <rect x="0"  y="32" width="64" height="2" fill="#3a7ad0"/>
  <rect x="0"  y="46" width="64" height="2" fill="#3a7ad0"/>
  <rect x="0"  y="60" width="64" height="2" fill="#3a7ad0"/>

  <!-- Ondas com espuma branca dispersa -->
  <rect x="4"  y="2"  width="6"  height="1" fill="#7acbff"/>
  <rect x="18" y="6"  width="8"  height="1" fill="#7acbff"/>
  <rect x="34" y="4"  width="6"  height="1" fill="#7acbff"/>
  <rect x="46" y="2"  width="10" height="1" fill="#7acbff"/>

  <rect x="2"  y="14" width="12" height="1" fill="#7acbff"/>
  <rect x="20" y="16" width="6"  height="1" fill="#7acbff"/>
  <rect x="32" y="12" width="10" height="1" fill="#7acbff"/>
  <rect x="48" y="16" width="14" height="1" fill="#7acbff"/>

  <rect x="6"  y="28" width="8"  height="1" fill="#7acbff"/>
  <rect x="20" y="30" width="10" height="1" fill="#7acbff"/>
  <rect x="36" y="26" width="8"  height="1" fill="#7acbff"/>
  <rect x="50" y="28" width="12" height="1" fill="#7acbff"/>

  <rect x="2"  y="42" width="10" height="1" fill="#7acbff"/>
  <rect x="16" y="44" width="6"  height="1" fill="#7acbff"/>
  <rect x="30" y="42" width="10" height="1" fill="#7acbff"/>
  <rect x="44" y="44" width="14" height="1" fill="#7acbff"/>

  <rect x="4"  y="56" width="12" height="1" fill="#7acbff"/>
  <rect x="22" y="54" width="6"  height="1" fill="#7acbff"/>
  <rect x="34" y="56" width="10" height="1" fill="#7acbff"/>
  <rect x="50" y="58" width="10" height="1" fill="#7acbff"/>

  <!-- Brilhos brancos (reflexos do sol) -->
  <rect x="12" y="10" width="2" height="1" fill="#ffffff"/>
  <rect x="28" y="20" width="2" height="1" fill="#ffffff"/>
  <rect x="42" y="22" width="2" height="1" fill="#ffffff"/>
  <rect x="54" y="34" width="2" height="1" fill="#ffffff"/>
  <rect x="10" y="38" width="2" height="1" fill="#ffffff"/>
  <rect x="34" y="48" width="2" height="1" fill="#ffffff"/>
  <rect x="46" y="52" width="2" height="1" fill="#ffffff"/>
