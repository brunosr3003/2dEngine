<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Água rasa azul-celeste com ondas suaves -->
  <rect x="0" y="0" width="64" height="64" fill="#7acbff"/>

  <!-- Tonalidade ligeiramente mais escura em faixas (profundidade/ondulação) -->
  <rect x="0"  y="12" width="64" height="2" fill="#5aabec"/>
  <rect x="0"  y="28" width="64" height="2" fill="#5aabec"/>
  <rect x="0"  y="44" width="64" height="2" fill="#5aabec"/>
  <rect x="0"  y="56" width="64" height="2" fill="#5aabec"/>

  <!-- Ondas brancas ~horizontais (quebra) -->
  <rect x="4"  y="6"  width="8"  height="1" fill="#d0ecff"/>
  <rect x="16" y="8"  width="10" height="1" fill="#d0ecff"/>
  <rect x="32" y="4"  width="8"  height="1" fill="#d0ecff"/>
  <rect x="44" y="10" width="14" height="1" fill="#d0ecff"/>

  <rect x="8"  y="20" width="12" height="1" fill="#d0ecff"/>
  <rect x="24" y="24" width="8"  height="1" fill="#d0ecff"/>
  <rect x="38" y="18" width="10" height="1" fill="#d0ecff"/>
  <rect x="52" y="22" width="10" height="1" fill="#d0ecff"/>

  <rect x="2"  y="36" width="10" height="1" fill="#d0ecff"/>
  <rect x="18" y="40" width="12" height="1" fill="#d0ecff"/>
  <rect x="34" y="34" width="8"  height="1" fill="#d0ecff"/>
  <rect x="46" y="38" width="14" height="1" fill="#d0ecff"/>

  <rect x="4"  y="52" width="14" height="1" fill="#d0ecff"/>
  <rect x="22" y="48" width="10" height="1" fill="#d0ecff"/>
  <rect x="36" y="54" width="8"  height="1" fill="#d0ecff"/>
  <rect x="48" y="50" width="12" height="1" fill="#d0ecff"/>

  <!-- Reflexos brancos pontuais (gotas) -->
  <rect x="12" y="14" width="2" height="1" fill="#ffffff"/>
  <rect x="30" y="12" width="2" height="1" fill="#ffffff"/>
  <rect x="50" y="16" width="2" height="1" fill="#ffffff"/>
  <rect x="10" y="32" width="2" height="1" fill="#ffffff"/>
  <rect x="40" y="26" width="2" height="1" fill="#ffffff"/>
  <rect x="56" y="30" width="2" height="1" fill="#ffffff"/>
  <rect x="6"  y="44" width="2" height="1" fill="#ffffff"/>
  <rect x="28" y="44" width="2" height="1" fill="#ffffff"/>
  <rect x="44" y="42" width="2" height="1" fill="#ffffff"/>
  <rect x="60" y="46" width="2" height="1" fill="#ffffff"/>
</svg>
