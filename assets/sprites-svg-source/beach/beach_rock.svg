<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Rocha de praia com musgo -->
  <!-- Sombra -->
  <ellipse cx="32" cy="56" rx="20" ry="3" fill="#000000" fill-opacity="0.35"/>

  <!-- Silhueta da rocha (degraus arredondados) -->
  <rect x="18" y="24" width="28" height="2" fill="#0a0a0a"/>
  <rect x="14" y="26" width="4"  height="2" fill="#0a0a0a"/>
  <rect x="46" y="26" width="4"  height="2" fill="#0a0a0a"/>
  <rect x="10" y="28" width="4"  height="6" fill="#0a0a0a"/>
  <rect x="50" y="28" width="4"  height="6" fill="#0a0a0a"/>
  <rect x="8"  y="34" width="2"  height="16" fill="#0a0a0a"/>
  <rect x="54" y="34" width="2"  height="16" fill="#0a0a0a"/>
  <rect x="10" y="50" width="4"  height="4" fill="#0a0a0a"/>
  <rect x="50" y="50" width="4"  height="4" fill="#0a0a0a"/>
  <rect x="14" y="54" width="36" height="2" fill="#0a0a0a"/>

  <!-- Preenchimento cinza (base) -->
  <rect x="18" y="26" width="28" height="2"  fill="#7a7a80"/>
  <rect x="14" y="28" width="36" height="6"  fill="#7a7a80"/>
  <rect x="10" y="34" width="44" height="16" fill="#7a7a80"/>
  <rect x="14" y="50" width="36" height="4"  fill="#7a7a80"/>

  <!-- Shading (sombras + highlights) -->
  <rect x="10" y="34" width="4"  height="16" fill="#5a5a60"/>
  <rect x="50" y="34" width="4"  height="16" fill="#5a5a60"/>
  <rect x="14" y="50" width="36" height="4"  fill="#5a5a60"/>
  <!-- Highlight topo -->
  <rect x="22" y="28" width="20" height="2"  fill="#a0a0a8"/>
  <rect x="26" y="26" width="12" height="2"  fill="#a0a0a8"/>
  <rect x="28" y="30" width="8"  height="2"  fill="#c0c0c8"/>
  <!-- Fissuras -->
  <rect x="22" y="32" width="1"  height="10" fill="#4a4a50"/>
  <rect x="40" y="36" width="1"  height="12" fill="#4a4a50"/>
  <rect x="30" y="40" width="1"  height="8"  fill="#4a4a50"/>
  <!-- Detalhes no meio -->
  <rect x="16" y="38" width="4"  height="2"  fill="#6a6a70"/>
  <rect x="42" y="42" width="6"  height="2"  fill="#6a6a70"/>
  <rect x="20" y="46" width="4"  height="2"  fill="#6a6a70"/>

  <!-- MUSGO VERDE (canto esquerdo e topo) -->
  <rect x="14" y="30" width="10" height="2" fill="#3a9030"/>
  <rect x="14" y="30" width="10" height="1" fill="#5ac04a"/>
  <rect x="16" y="32" width="6"  height="1" fill="#3a9030"/>
  <rect x="12" y="34" width="2"  height="4" fill="#3a9030"/>
  <rect x="12" y="34" width="2"  height="2" fill="#5ac04a"/>
  <rect x="44" y="34" width="6"  height="2" fill="#3a9030"/>
  <rect x="44" y="34" width="6"  height="1" fill="#5ac04a"/>
  <rect x="48" y="36" width="4"  height="1" fill="#3a9030"/>

  <!-- CONCHINHA E ALGA (detalhes pequenos) -->
  <rect x="28" y="50" width="3"  height="2" fill="#fff0b0"/>
  <rect x="29" y="50" width="1"  height="1" fill="#e8bc60"/>
  <rect x="38" y="48" width="2"  height="4" fill="#3a9030"/>
  <rect x="37" y="52" width="4"  height="1" fill="#206020"/>
