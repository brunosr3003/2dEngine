<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- ========== COQUEIRO 64x64 — vista top-down-isométrica leve ========== -->
  <!-- Sombra no chão -->
  <ellipse cx="32" cy="56" rx="14" ry="3" fill="#000000" fill-opacity="0.35"/>
  <rect x="18" y="54" width="28" height="4" fill="#3a2a1a" fill-opacity="0.2"/>

  <!-- TRONCO (com anéis/gomos característicos do coqueiro) -->
  <rect x="28" y="30" width="8"  height="26" fill="#6a3a20"/>
  <!-- Linhas esquerdas (sombra) -->
  <rect x="28" y="30" width="1"  height="26" fill="#4a2a18"/>
  <!-- Highlight direito -->
  <rect x="34" y="30" width="2"  height="26" fill="#8a5a30"/>
  <!-- Anéis/gomos horizontais -->
  <rect x="28" y="34" width="8"  height="1"  fill="#4a2a18"/>
  <rect x="28" y="40" width="8"  height="1"  fill="#4a2a18"/>
  <rect x="28" y="46" width="8"  height="1"  fill="#4a2a18"/>
  <rect x="28" y="52" width="8"  height="1"  fill="#4a2a18"/>
  <rect x="28" y="35" width="8"  height="1"  fill="#c08050"/>
  <rect x="28" y="41" width="8"  height="1"  fill="#c08050"/>
  <rect x="28" y="47" width="8"  height="1"  fill="#c08050"/>
  <!-- Base do tronco (leve alargamento) -->
  <rect x="26" y="53" width="12" height="3" fill="#4a2a18"/>
  <rect x="27" y="54" width="10" height="2" fill="#6a3a20"/>

  <!-- Outline do tronco -->
  <rect x="27" y="30" width="1"  height="26" fill="#2a1810"/>
  <rect x="36" y="30" width="1"  height="26" fill="#2a1810"/>

  <!-- ========== COPA DAS FOLHAS (6 folhas radiais) ========== -->
  <!-- Folha CIMA -->
  <rect x="30" y="4"  width="4"  height="8" fill="#206020"/>
  <rect x="31" y="4"  width="2"  height="8" fill="#3a9030"/>
  <rect x="28" y="6"  width="2"  height="4" fill="#206020"/>
  <rect x="34" y="6"  width="2"  height="4" fill="#206020"/>
  <rect x="28" y="10" width="8"  height="2" fill="#3a9030"/>
  <rect x="29" y="10" width="6"  height="1" fill="#5ac04a"/>

  <!-- Folha ESQUERDA (diagonal) -->
  <rect x="8"  y="12" width="8"  height="4" fill="#206020"/>
  <rect x="16" y="10" width="6"  height="4" fill="#206020"/>
  <rect x="22" y="10" width="4"  height="4" fill="#3a9030"/>
  <rect x="10" y="14" width="4"  height="2" fill="#3a9030"/>
  <rect x="16" y="12" width="6"  height="2" fill="#3a9030"/>
  <rect x="22" y="12" width="4"  height="2" fill="#5ac04a"/>
  <rect x="10" y="13" width="2"  height="1" fill="#5ac04a"/>

  <!-- Folha DIREITA (diagonal) -->
  <rect x="48" y="12" width="8"  height="4" fill="#206020"/>
  <rect x="42" y="10" width="6"  height="4" fill="#206020"/>
  <rect x="38" y="10" width="4"  height="4" fill="#3a9030"/>
  <rect x="50" y="14" width="4"  height="2" fill="#3a9030"/>
  <rect x="42" y="12" width="6"  height="2" fill="#3a9030"/>
  <rect x="38" y="12" width="4"  height="2" fill="#5ac04a"/>
  <rect x="52" y="13" width="2"  height="1" fill="#5ac04a"/>

  <!-- Folha SUP-ESQ (curta) -->
  <rect x="16" y="4"  width="4"  height="6" fill="#206020"/>
  <rect x="20" y="6"  width="4"  height="4" fill="#3a9030"/>
  <rect x="17" y="6"  width="2"  height="4" fill="#3a9030"/>
  <rect x="20" y="8"  width="2"  height="2" fill="#5ac04a"/>

  <!-- Folha SUP-DIR (curta) -->
  <rect x="44" y="4"  width="4"  height="6" fill="#206020"/>
  <rect x="40" y="6"  width="4"  height="4" fill="#3a9030"/>
  <rect x="45" y="6"  width="2"  height="4" fill="#3a9030"/>
  <rect x="42" y="8"  width="2"  height="2" fill="#5ac04a"/>

  <!-- Folha BAIXO-ESQ (pendurada) -->
  <rect x="18" y="18" width="8"  height="4" fill="#206020"/>
  <rect x="20" y="18" width="6"  height="2" fill="#3a9030"/>
  <rect x="22" y="20" width="4"  height="2" fill="#3a9030"/>

  <!-- Folha BAIXO-DIR (pendurada) -->
  <rect x="38" y="18" width="8"  height="4" fill="#206020"/>
  <rect x="38" y="18" width="6"  height="2" fill="#3a9030"/>
  <rect x="38" y="20" width="4"  height="2" fill="#3a9030"/>

  <!-- ========== COCOS (3 no centro) ========== -->
  <rect x="26" y="22" width="4"  height="4" fill="#4a2a18"/>
  <rect x="27" y="22" width="2"  height="1" fill="#8a5a30"/>
  <rect x="26" y="24" width="1"  height="1" fill="#2a1810"/>

  <rect x="30" y="20" width="4"  height="4" fill="#4a2a18"/>
  <rect x="31" y="20" width="2"  height="1" fill="#8a5a30"/>
  <rect x="30" y="22" width="1"  height="1" fill="#2a1810"/>

  <rect x="34" y="22" width="4"  height="4" fill="#4a2a18"/>
  <rect x="35" y="22" width="2"  height="1" fill="#8a5a30"/>
  <rect x="34" y="24" width="1"  height="1" fill="#2a1810"/>

  <!-- Centro da copa (topo do tronco) -->
  <rect x="28" y="26" width="8"  height="4" fill="#3a9030"/>
  <rect x="30" y="26" width="4"  height="2" fill="#5ac04a"/>
  <rect x="28" y="28" width="8"  height="2" fill="#206020"/>
</svg>
