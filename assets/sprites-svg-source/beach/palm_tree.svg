  <rect x="30" y="22" width="4"  height="4" fill="#4a2a18"/>
  <rect x="30" y="22" width="4"  height="1" fill="#2a1810"/>
  <rect x="30" y="22" width="1"  height="4" fill="#2a1810"/>
  <rect x="33" y="22" width="1"  height="4" fill="#2a1810"/>
  <rect x="30" y="25" width="4"  height="1" fill="#2a1810"/>
  <rect x="31" y="23" width="2"  height="1" fill="#6a3a20"/>

  <!-- Coco esquerdo -->
  <rect x="25" y="24" width="4"  height="4" fill="#4a2a18"/>
  <rect x="25" y="24" width="4"  height="1" fill="#2a1810"/>
  <rect x="25" y="24" width="1"  height="4" fill="#2a1810"/>
  <rect x="28" y="24" width="1"  height="4" fill="#2a1810"/>
  <rect x="25" y="27" width="4"  height="1" fill="#2a1810"/>
  <rect x="26" y="25" width="2"  height="1" fill="#6a3a20"/>

  <!-- Coco direito -->
  <rect x="35" y="24" width="4"  height="4" fill="#4a2a18"/>
  <rect x="35" y="24" width="4"  height="1" fill="#2a1810"/>
  <rect x="35" y="24" width="1"  height="4" fill="#2a1810"/>
  <rect x="38" y="24" width="1"  height="4" fill="#2a1810"/>
  <rect x="35" y="27" width="4"  height="1" fill="#2a1810"/>
  <rect x="36" y="25" width="2"  height="1" fill="#6a3a20"/>

