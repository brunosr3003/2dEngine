       FOLHAS RADIAIS — 7 folhas dramáticas em direções diferentes
       Cada folha tem: outline + sombra + base + highlight + tip
       ============================================================ -->

  <!-- ========== FOLHA N (cima, vertical, dominante) ========== -->
  <!-- Outline -->
  <rect x="29" y="0"  width="6"  height="1"  fill="#0a3010"/>
  <rect x="27" y="1"  width="10" height="1"  fill="#0a3010"/>
  <rect x="25" y="2"  width="14" height="1"  fill="#0a3010"/>
  <rect x="23" y="4"  width="18" height="1"  fill="#0a3010"/>
  <rect x="25" y="22" width="14" height="1"  fill="#0a3010"/>
  <!-- Preenchimento base -->
  <rect x="29" y="1"  width="6"  height="1"  fill="#3a9030"/>
  <rect x="27" y="2"  width="10" height="2"  fill="#3a9030"/>
  <rect x="25" y="3"  width="14" height="3"  fill="#3a9030"/>
  <rect x="23" y="5"  width="18" height="6"  fill="#3a9030"/>
  <rect x="24" y="11" width="16" height="5"  fill="#3a9030"/>
  <rect x="25" y="16" width="14" height="6"  fill="#3a9030"/>
  <!-- Sombra inferior da folha -->
  <rect x="24" y="14" width="16" height="2"  fill="#206020"/>
  <rect x="25" y="19" width="14" height="3"  fill="#206020"/>
  <!-- Veia central -->
