<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- ============================================================
       COQUEIRO 64x64 v2 — copa frondosa + tronco curvo realista
       Paleta: 14 cores, 3 tons pra folhas, 3 tons pro tronco
       ============================================================ -->

  <!-- Sombra no chão -->
  <ellipse cx="32" cy="60" rx="12" ry="3" fill="#000000" fill-opacity="0.4"/>
  <rect x="24" y="58" width="18" height="3" fill="#2a1810" fill-opacity="0.3"/>

  <!-- ============================================================
       TRONCO (ligeiramente curvo, com anéis característicos)
       ============================================================ -->
  <!-- Base mais larga -->
  <rect x="24" y="56" width="18" height="4"  fill="#4a2a18"/>
  <rect x="24" y="56" width="18" height="1"  fill="#2a1810"/>
  <rect x="24" y="56" width="1"  height="4"  fill="#2a1810"/>
  <rect x="41" y="56" width="1"  height="4"  fill="#2a1810"/>
  <rect x="25" y="57" width="16" height="1"  fill="#6a3a20"/>

  <!-- Corpo do tronco (de baixo pra cima, com leve curva) -->
  <rect x="26" y="48" width="14" height="8" fill="#6a3a20"/>
  <rect x="27" y="40" width="12" height="8" fill="#6a3a20"/>
  <rect x="28" y="32" width="10" height="8" fill="#6a3a20"/>
  <rect x="29" y="26" width="8"  height="6" fill="#6a3a20"/>

  <!-- Outline lateral do tronco -->
  <rect x="26" y="48" width="1"  height="8" fill="#2a1810"/>
  <rect x="39" y="48" width="1"  height="8" fill="#2a1810"/>
  <rect x="27" y="40" width="1"  height="8" fill="#2a1810"/>
  <rect x="38" y="40" width="1"  height="8" fill="#2a1810"/>
  <rect x="28" y="32" width="1"  height="8" fill="#2a1810"/>
  <rect x="37" y="32" width="1"  height="8" fill="#2a1810"/>
  <rect x="29" y="26" width="1"  height="6" fill="#2a1810"/>
  <rect x="36" y="26" width="1"  height="6" fill="#2a1810"/>

  <!-- Highlight (luz lateral direita) -->
  <rect x="37" y="48" width="2"  height="8" fill="#8a5a30"/>
  <rect x="36" y="40" width="2"  height="8" fill="#8a5a30"/>
  <rect x="35" y="32" width="2"  height="8" fill="#8a5a30"/>
  <rect x="34" y="26" width="2"  height="6" fill="#8a5a30"/>
  <rect x="38" y="52" width="1"  height="3" fill="#b07850"/>

  <!-- Sombra lateral esquerda -->
  <rect x="27" y="48" width="2"  height="8" fill="#4a2a18"/>
  <rect x="28" y="40" width="2"  height="8" fill="#4a2a18"/>
  <rect x="29" y="32" width="2"  height="8" fill="#4a2a18"/>
  <rect x="30" y="26" width="2"  height="6" fill="#4a2a18"/>

  <!-- ANÉIS/GOMOS característicos do coqueiro (horizontais escuros + claros) -->
  <rect x="24" y="55" width="18" height="1" fill="#2a1810"/>
  <rect x="26" y="47" width="14" height="1" fill="#2a1810"/>
  <rect x="27" y="39" width="12" height="1" fill="#2a1810"/>
  <rect x="28" y="31" width="10" height="1" fill="#2a1810"/>
  <rect x="26" y="52" width="14" height="1" fill="#4a2a18"/>
  <rect x="27" y="44" width="12" height="1" fill="#4a2a18"/>
  <rect x="28" y="36" width="10" height="1" fill="#4a2a18"/>
  <rect x="29" y="28" width="8"  height="1" fill="#4a2a18"/>
