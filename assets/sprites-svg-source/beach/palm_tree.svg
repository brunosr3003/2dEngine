  <rect x="27" y="53" width="12" height="1" fill="#8a5a30"/>
  <rect x="28" y="45" width="10" height="1" fill="#8a5a30"/>
  <rect x="29" y="37" width="8"  height="1" fill="#8a5a30"/>

