  <rect x="31" y="5"  width="2"  height="1"  fill="#5ac04a"/>
  <rect x="31" y="10" width="2"  height="1"  fill="#5ac04a"/>
  <rect x="31" y="15" width="2"  height="1"  fill="#5ac04a"/>
  <!-- Highlights (folíolos) -->
  <rect x="28" y="4"  width="2"  height="2"  fill="#5ac04a"/>
  <rect x="34" y="4"  width="2"  height="2"  fill="#5ac04a"/>
  <rect x="25" y="7"  width="3"  height="2"  fill="#5ac04a"/>
  <rect x="36" y="7"  width="3"  height="2"  fill="#5ac04a"/>
  <rect x="24" y="12" width="3"  height="2"  fill="#5ac04a"/>
  <rect x="37" y="12" width="3"  height="2"  fill="#5ac04a"/>
  <rect x="25" y="17" width="3"  height="2"  fill="#5ac04a"/>
  <rect x="36" y="17" width="3"  height="2"  fill="#5ac04a"/>
  <!-- Tip brilhante no topo -->
  <rect x="30" y="0"  width="4"  height="1"  fill="#80d060"/>

  <!-- ========== FOLHA NE (diagonal cima-direita) ========== -->
  <rect x="40" y="6"  width="20" height="3" fill="#3a9030"/>
  <rect x="40" y="5"  width="20" height="1" fill="#0a3010"/>
  <rect x="40" y="9"  width="20" height="1" fill="#0a3010"/>
  <rect x="40" y="8"  width="18" height="1" fill="#206020"/>
  <rect x="42" y="6"  width="14" height="1" fill="#5ac04a"/>
  <rect x="58" y="4"  width="4"  height="2" fill="#3a9030"/>
  <rect x="58" y="3"  width="4"  height="1" fill="#0a3010"/>
  <rect x="58" y="6"  width="4"  height="1" fill="#5ac04a"/>
  <rect x="60" y="2"  width="3"  height="1" fill="#80d060"/>
  <!-- Conexao com a copa -->
  <rect x="36" y="7"  width="6"  height="2" fill="#3a9030"/>
  <rect x="36" y="6"  width="6"  height="1" fill="#0a3010"/>
  <rect x="36" y="9"  width="6"  height="1" fill="#0a3010"/>

  <!-- ========== FOLHA NW (diagonal cima-esquerda) ========== -->
  <rect x="4"  y="6"  width="20" height="3" fill="#3a9030"/>
  <rect x="4"  y="5"  width="20" height="1" fill="#0a3010"/>
  <rect x="4"  y="9"  width="20" height="1" fill="#0a3010"/>
  <rect x="6"  y="8"  width="18" height="1" fill="#206020"/>
  <rect x="8"  y="6"  width="14" height="1" fill="#5ac04a"/>
  <rect x="2"  y="4"  width="4"  height="2" fill="#3a9030"/>
  <rect x="2"  y="3"  width="4"  height="1" fill="#0a3010"/>
  <rect x="2"  y="6"  width="4"  height="1" fill="#5ac04a"/>
  <rect x="1"  y="2"  width="3"  height="1" fill="#80d060"/>
  <rect x="22" y="7"  width="6"  height="2" fill="#3a9030"/>
  <rect x="22" y="6"  width="6"  height="1" fill="#0a3010"/>
  <rect x="22" y="9"  width="6"  height="1" fill="#0a3010"/>

  <!-- ========== FOLHA E (horizontal direita) ========== -->
  <rect x="38" y="18" width="20" height="4" fill="#3a9030"/>
  <rect x="38" y="17" width="20" height="1" fill="#0a3010"/>
  <rect x="38" y="22" width="20" height="1" fill="#0a3010"/>
  <rect x="40" y="20" width="16" height="1" fill="#206020"/>
  <rect x="40" y="19" width="14" height="1" fill="#5ac04a"/>
  <rect x="56" y="20" width="4"  height="1" fill="#5ac04a"/>
  <rect x="58" y="17" width="2"  height="4" fill="#3a9030"/>
  <rect x="58" y="16" width="2"  height="1" fill="#0a3010"/>
  <rect x="58" y="21" width="2"  height="1" fill="#0a3010"/>
  <rect x="60" y="18" width="3"  height="2" fill="#80d060"/>

  <!-- ========== FOLHA W (horizontal esquerda) ========== -->
  <rect x="6"  y="18" width="20" height="4" fill="#3a9030"/>
  <rect x="6"  y="17" width="20" height="1" fill="#0a3010"/>
  <rect x="6"  y="22" width="20" height="1" fill="#0a3010"/>
  <rect x="8"  y="20" width="16" height="1" fill="#206020"/>
  <rect x="10" y="19" width="14" height="1" fill="#5ac04a"/>
  <rect x="4"  y="20" width="4"  height="1" fill="#5ac04a"/>
  <rect x="4"  y="17" width="2"  height="4" fill="#3a9030"/>
  <rect x="4"  y="16" width="2"  height="1" fill="#0a3010"/>
  <rect x="4"  y="21" width="2"  height="1" fill="#0a3010"/>
  <rect x="1"  y="18" width="3"  height="2" fill="#80d060"/>

  <!-- ========== FOLHA SE (diagonal baixo-direita, pendurada) ========== -->
  <rect x="40" y="28" width="14" height="3" fill="#3a9030"/>
  <rect x="40" y="27" width="14" height="1" fill="#0a3010"/>
  <rect x="40" y="31" width="14" height="1" fill="#0a3010"/>
  <rect x="42" y="30" width="10" height="1" fill="#206020"/>
  <rect x="42" y="29" width="10" height="1" fill="#5ac04a"/>
  <rect x="54" y="29" width="4"  height="1" fill="#3a9030"/>
  <rect x="54" y="28" width="4"  height="1" fill="#0a3010"/>
  <rect x="54" y="30" width="4"  height="1" fill="#0a3010"/>
  <rect x="58" y="30" width="3"  height="1" fill="#80d060"/>

  <!-- ========== FOLHA SW (diagonal baixo-esquerda, pendurada) ========== -->
  <rect x="10" y="28" width="14" height="3" fill="#3a9030"/>
  <rect x="10" y="27" width="14" height="1" fill="#0a3010"/>
  <rect x="10" y="31" width="14" height="1" fill="#0a3010"/>
  <rect x="12" y="30" width="10" height="1" fill="#206020"/>
  <rect x="12" y="29" width="10" height="1" fill="#5ac04a"/>
  <rect x="6"  y="29" width="4"  height="1" fill="#3a9030"/>
  <rect x="6"  y="28" width="4"  height="1" fill="#0a3010"/>
  <rect x="6"  y="30" width="4"  height="1" fill="#0a3010"/>
  <rect x="3"  y="30" width="3"  height="1" fill="#80d060"/>

  <!-- ============================================================
       CENTRO DA COPA (tufo de folhas novas no topo do tronco)
       ============================================================ -->
  <rect x="27" y="24" width="12" height="4" fill="#206020"/>
  <rect x="29" y="22" width="8"  height="4" fill="#3a9030"/>
  <rect x="30" y="23" width="6"  height="2" fill="#5ac04a"/>
  <rect x="31" y="21" width="4"  height="2" fill="#5ac04a"/>
  <rect x="32" y="20" width="2"  height="1" fill="#80d060"/>
</svg>
