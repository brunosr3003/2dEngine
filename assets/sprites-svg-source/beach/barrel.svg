<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Barril de madeira pirata -->
  <!-- Sombra -->
  <ellipse cx="32" cy="58" rx="12" ry="2" fill="#000000" fill-opacity="0.35"/>

  <!-- Corpo (ligeiramente barrigudo no meio) -->
  <rect x="18" y="12" width="28" height="2"  fill="#6a3a20"/>
  <rect x="16" y="14" width="32" height="4"  fill="#6a3a20"/>
  <rect x="14" y="18" width="36" height="24" fill="#6a3a20"/>
  <rect x="16" y="42" width="32" height="4"  fill="#6a3a20"/>
  <rect x="18" y="46" width="28" height="2"  fill="#6a3a20"/>

  <!-- Outline -->
  <rect x="18" y="12" width="28" height="1"  fill="#2a1810"/>
  <rect x="16" y="14" width="2"  height="4"  fill="#2a1810"/>
  <rect x="46" y="14" width="2"  height="4"  fill="#2a1810"/>
  <rect x="14" y="18" width="1"  height="24" fill="#2a1810"/>
  <rect x="49" y="18" width="1"  height="24" fill="#2a1810"/>
  <rect x="16" y="42" width="2"  height="4"  fill="#2a1810"/>
  <rect x="46" y="42" width="2"  height="4"  fill="#2a1810"/>
  <rect x="18" y="47" width="28" height="1"  fill="#2a1810"/>

