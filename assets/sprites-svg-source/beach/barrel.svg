  <rect x="22" y="14" width="1" height="34" fill="#4a2a18"/>
  <rect x="28" y="14" width="1" height="34" fill="#4a2a18"/>
  <rect x="34" y="14" width="1" height="34" fill="#4a2a18"/>
  <rect x="40" y="14" width="1" height="34" fill="#4a2a18"/>
  <!-- Highlights das pranchas -->
  <rect x="20" y="16" width="1" height="30" fill="#8a5a30"/>
  <rect x="25" y="20" width="1" height="22" fill="#8a5a30"/>
  <rect x="37" y="18" width="1" height="26" fill="#8a5a30"/>
  <rect x="43" y="20" width="1" height="22" fill="#a06840"/>
  <rect x="20" y="22" width="2" height="4"  fill="#a06840"/>
  <rect x="36" y="24" width="2" height="4"  fill="#a06840"/>

  <!-- ARCOS DE METAL (3 fitas) -->
  <!-- Arco topo -->
  <rect x="16" y="18" width="32" height="2" fill="#3a3a3a"/>
  <rect x="16" y="18" width="32" height="1" fill="#6a6a6a"/>
  <!-- Arco meio -->
  <rect x="14" y="28" width="36" height="2" fill="#3a3a3a"/>
  <rect x="14" y="28" width="36" height="1" fill="#6a6a6a"/>
  <!-- Arco baixo -->
  <rect x="16" y="40" width="32" height="2" fill="#3a3a3a"/>
  <rect x="16" y="40" width="32" height="1" fill="#6a6a6a"/>

  <!-- Tampa superior (tábua central circular) -->
  <rect x="22" y="12" width="20" height="2" fill="#4a2a18"/>
  <rect x="24" y="12" width="16" height="1" fill="#8a5a30"/>
  <!-- Pregos da tampa -->
  <rect x="24" y="13" width="1" height="1" fill="#6a6a6a"/>
