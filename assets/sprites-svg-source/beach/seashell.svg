  <rect x="14" y="24" width="4"  height="4" fill="#0a0a0a"/>
  <rect x="46" y="24" width="4"  height="4" fill="#0a0a0a"/>
  <rect x="12" y="28" width="2"  height="14" fill="#0a0a0a"/>
